<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Chuckle Hub: a daily dose of smiles</title>
  <meta name="description" content="A fresh joke whenever you need one. Tap, groan, grin, repeat.">
  <meta name="theme-color" content="#FFD84D">

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Chuckle Hub">
  <meta property="og:title" content="The Chuckle Hub: a daily dose of smiles">
  <meta property="og:description" content="Rough day? Here's a joke to turn it around.">
  <meta property="og:url" content="https://chuckle-hub.suvadipchakraborty.workers.dev/">
  <meta property="og:image" content="https://chuckle-hub.suvadipchakraborty.workers.dev/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="The Chuckle Hub: a daily dose of smiles">
  <meta name="twitter:description" content="Rough day? Here's a joke to turn it around.">
  <meta name="twitter:image" content="https://chuckle-hub.suvadipchakraborty.workers.dev/preview.png">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="./" aria-label="The Chuckle Hub home">
      <svg viewBox="0 0 48 48" width="36" height="36" aria-hidden="true">
        <circle cx="24" cy="24" r="21" fill="#FFD84D" stroke="#2B2118" stroke-width="3"/>
        <circle cx="17" cy="19" r="3" fill="#2B2118"/><circle cx="31" cy="19" r="3" fill="#2B2118"/>
        <path d="M13 28c3 8 19 8 22 0z" fill="#FF7A66" stroke="#2B2118" stroke-width="3" stroke-linejoin="round"/>
      </svg>
      <span>The Chuckle Hub</span>
    </a>
    <button id="installBtn" class="pill" type="button">Save App</button>
  </header>

  <main>
    <p class="tagline">Rough day? Let's fix that.</p>

    <section id="card" class="card" aria-live="polite" aria-busy="true">
      <div id="loading" class="loading">
        <div class="bounce" aria-hidden="true">😄</div>
        <p>Thinking of a good one...</p>
      </div>
      <div id="joke" hidden>
        <p id="text1" class="text1"></p>
        <button id="revealBtn" class="reveal" type="button" hidden>Reveal punchline</button>
        <p id="text2" class="text2" hidden></p>
      </div>
      <p id="source" class="source"></p>
    </section>

    <div class="actions">
      <button id="likeBtn" class="round" type="button" aria-pressed="false" aria-label="Save to favorites" title="Save to favorites">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path class="heart" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 4.5 6.4 4.5c2.1 0 3.9 1.2 5.6 3.2 1.7-2 3.5-3.2 5.6-3.2 3.7 0 5.5 3.9 4 7.3C19.5 16.4 12 21 12 21z"/></svg>
      </button>
      <button id="shareBtn" class="round" type="button" aria-label="Share this joke" title="Share this joke">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg>
      </button>
      <button id="favsBtn" class="round" type="button" aria-label="Open favorites" title="Favorites">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
        <span id="favCount" class="badge" hidden>0</span>
      </button>
    </div>
  </main>

  <footer>
    <p>Built by Suva · <a href="mailto:suvadipchakraborty@gmail.com?subject=Chuckle%20Hub%20feedback">Send feedback</a></p>
  </footer>

  <button id="fab" class="fab" type="button">Make Me Smile Again</button>

  <dialog id="favDialog" class="sheet" aria-labelledby="favTitle">
    <div class="sheet-head">
      <h2 id="favTitle">Your favorites</h2>
      <button id="closeFavs" class="pill" type="button">Close</button>
    </div>
    <ul id="favList" class="fav-list"></ul>
    <p id="favEmpty" class="empty">Nothing here yet. Tap the heart on a joke you love and it will wait for you here.</p>
  </dialog>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js" type="module"></script>
</body>
</html>
